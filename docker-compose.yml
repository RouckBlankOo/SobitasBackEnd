version: '3.8'

services:
  # NestJS API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sobitas-api
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/sobitas-db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ADMIN_FRONTEND_URL=${ADMIN_FRONTEND_URL:-http://localhost:3000}
      - ECOMMERCE_FRONTEND_URL=${ECOMMERCE_FRONTEND_URL:-http://localhost:3001}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
    depends_on:
      - mongo
      - redis
    networks:
      - sobitas-network
    volumes:
      - ./uploads:/app/uploads
      - api-logs:/app/logs
    labels:
      - "com.sobitas.service=api"
      - "com.sobitas.version=1.0.0"

  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: sobitas-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-admin123}
      - MONGO_INITDB_DATABASE=sobitas-db
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - sobitas-network
    command: mongod --auth

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sobitas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sobitas-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: sobitas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - sobitas-network

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  redis-data:
    driver: local
  api-logs:
    driver: local
  nginx-logs:
    driver: local

networks:
  sobitas-network:
    driver: bridge

